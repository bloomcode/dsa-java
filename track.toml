[[chapters]]
n = "1.1"
title = "Counting steps: how cost grows with input"
short = "Counting steps"
focus = "Count how many steps code takes as its input grows, and name the growth with Big O: constant, logarithmic, linear, quadratic, exponential."
file = "src/Ch1_1CountingSteps.java"

[[chapters]]
n = "1.2"
title = "Memory as a cost"
short = "Memory"
focus = "Measure the extra memory an algorithm needs, the call stack included, and trade time against space."
file = "src/Ch1_2MemoryCost.java"

[[chapters]]
n = "1.3"
title = "Timing real code"
short = "Timing"
focus = "Time code with a monotonic clock, repeat to tame the noise, and check measurements against the predicted growth."
file = "src/Ch1_3Timing.java"

[[chapters]]
n = "2.1"
title = "Arrays and dynamic arrays"
short = "Arrays"
focus = "Build each array operation by hand, count its steps, and grow the array when it fills."
file = "src/Ch2_1Arrays.java"

[[chapters]]
n = "2.2"
title = "Searching sorted data"
short = "Sorted search"
focus = "Keep data in order and search it in O(log N): binary search, lower bounds and their variations."
file = "src/Ch2_2SortedSearch.java"

[[chapters]]
n = "2.3"
title = "Linked lists"
short = "Linked lists"
focus = "Build singly and doubly linked lists, walk them with pointers, and see where they beat arrays."
file = "src/Ch2_3LinkedLists.java"

[[chapters]]
n = "2.4"
title = "Stacks and queues"
short = "Stacks and queues"
focus = "Restrict access to one end or both, and use the restriction to match, undo, schedule and evaluate."
file = "src/Ch2_4StacksQueues.java"

[[chapters]]
n = "2.5"
title = "Strings"
short = "Strings"
focus = "Work through text with counts, two pointers and sliding windows: edits, palindromes, anagrams and the shortest window that covers a set of letters."
file = "src/Ch2_5Strings.java"

[[chapters]]
n = "2.6"
title = "Two pointers and intervals"
short = "Two pointers"
focus = "Walk a sorted array from both ends or with a read and a write pointer, and sort intervals by start to merge and intersect them in one pass."
file = "src/Ch2_6TwoPointers.java"

[[chapters]]
n = "2.7"
title = "Grids and matrices"
short = "Grids"
focus = "Index a grid by row and column: walk it in spirals and diagonals, search a sorted grid from a corner, and change it in place using its own cells as scratch space."
file = "src/Ch2_7Grids.java"

[[chapters]]
n = "3.1"
title = "Simple sorts: bubble, selection and insertion"
short = "Simple sorts"
focus = "Bubble, selection and insertion sort: count their comparisons and moves, and see when each is the right tool."
file = "src/Ch3_1SimpleSorts.java"

[[chapters]]
n = "3.2"
title = "Divide and conquer: mergesort, quicksort and quickselect"
short = "Divide and conquer"
focus = "Split, solve, combine: mergesort, quicksort and quickselect, and what each costs in the best and worst case."
file = "src/Ch3_2DivideConquer.java"

[[chapters]]
n = "3.3"
title = "Linear-time sorts"
short = "Linear sorts"
focus = "Beat the N log N bound for comparison sorts by not comparing: count small keys, sort digit by digit, or spread values over buckets."
file = "src/Ch3_3LinearSorts.java"

[[chapters]]
n = "4.1"
title = "Hash tables"
short = "Hash tables"
focus = "Turn keys into array positions for O(1) lookup, and use a table to count, group and match."
file = "src/Ch4_1HashTables.java"

[[chapters]]
n = "4.2"
title = "Hash functions"
short = "Hash functions"
focus = "What makes a hash function spread keys well, and how picking it at random defeats hostile input."
file = "src/Ch4_2HashFunctions.java"

[[chapters]]
n = "4.3"
title = "Rolling hashes and text search"
short = "Text search"
focus = "Search text with a hash that updates in O(1) per step, and decide when a match must be verified."
file = "src/Ch4_3TextSearch.java"

[[chapters]]
n = "5.1"
title = "Binary search trees"
short = "Search trees"
focus = "Keep keys ordered in a tree for O(log N) search, insert and delete, as long as the tree stays bushy."
file = "src/Ch5_1BinarySearchTrees.java"

[[chapters]]
n = "5.2"
title = "Heaps and priority queues"
short = "Heaps"
focus = "Always reach the most urgent item in O(log N) with a heap stored in an array."
file = "src/Ch5_2Heaps.java"

[[chapters]]
n = "5.3"
title = "Tries"
short = "Tries"
focus = "Store words letter by letter to answer prefix questions fast."
file = "src/Ch5_3Tries.java"

[[chapters]]
n = "5.4"
title = "Self-balancing trees: red-black trees and treaps"
short = "Balanced trees"
focus = "Keep a search tree's height logarithmic whatever the insert order: colour rules, or random priorities."
file = "src/Ch5_4BalancedTrees.java"

[[chapters]]
n = "5.5"
title = "B-trees and block storage"
short = "B-trees"
focus = "Count block reads instead of steps, and pack many keys per node to keep the tree shallow."
file = "src/Ch5_5BTrees.java"

[[chapters]]
n = "5.6"
title = "Binary trees"
short = "Binary trees"
focus = "Trees with no ordering rule: recursion that returns more than one fact, level-by-level walks, paths, ancestors, and turning a tree into text and back. Examples write a tree as value(left, right), with - for a missing child."
file = "src/Ch5_6BinaryTrees.java"

[[chapters]]
n = "6.1"
title = "Graphs: representation and traversal"
short = "Graph traversal"
focus = "Store a graph as adjacency lists or a matrix, and visit it depth-first or breadth-first."
file = "src/Ch6_1Graphs.java"

[[chapters]]
n = "6.2"
title = "Shortest paths and ordering"
short = "Paths and order"
focus = "Find the fewest hops, the cheapest route, and an order that respects every dependency."
file = "src/Ch6_2PathsOrder.java"

[[chapters]]
n = "6.3"
title = "Union-find and spanning trees"
short = "Union-find"
focus = "Keep groups that only ever merge: a forest of parent links with path compression and union by size answers same-group questions in near-constant time, which drives cycle checks and minimum spanning trees."
file = "src/Ch6_3UnionFind.java"

[[chapters]]
n = "6.4"
title = "Grid and implicit graphs"
short = "Implicit graphs"
focus = "Graphs that are never written down: cells of a grid, moves of a piece, words one letter apart. Breadth-first search counts steps, depth-first search fills regions, and colours or memos keep each vertex to one visit."
file = "src/Ch6_4ImplicitGraphs.java"

[[chapters]]
n = "7.1"
title = "Recursion"
short = "Recursion"
focus = "Solve a problem through a smaller copy of itself: base cases, the call stack, and building results on the way back."
file = "src/Ch7_1Recursion.java"

[[chapters]]
n = "7.2"
title = "Dynamic programming"
short = "Dynamic programming"
focus = "Stop recomputing overlapping subproblems: memoize top-down or fill a table bottom-up."
file = "src/Ch7_2DynamicProgramming.java"

[[chapters]]
n = "7.3"
title = "Greedy choices and problem transforms"
short = "Greedy and transforms"
focus = "Take the locally best step when it is provably safe, or reshape the data until the problem gets easy."
file = "src/Ch7_3GreedyTransforms.java"

[[chapters]]
n = "7.4"
title = "Randomized algorithms"
short = "Randomized"
focus = "Use randomness to shuffle, sample, balance and estimate, and to test primes fast with a tiny chance of error."
file = "src/Ch7_4Randomized.java"

[[chapters]]
n = "7.5"
title = "Backtracking"
short = "Backtracking"
focus = "Build answers one choice at a time, undo the choice, try the next: orderings, combinations, placements and puzzles, with pruning that cuts dead branches early."
file = "src/Ch7_5Backtracking.java"

[[chapters]]
n = "8.1"
title = "Caching and eviction"
short = "Caching"
focus = "Keep recent answers close: LRU and other eviction policies, and how to measure a hit rate."
file = "src/Ch8_1Caching.java"

[[chapters]]
n = "8.2"
title = "External memory: sorting data bigger than RAM"
short = "External sort"
focus = "Sort data that does not fit in memory by making runs and merging them, counting I/Os as you go."
file = "src/Ch8_2ExternalSort.java"

[[chapters]]
n = "8.3"
title = "Compact sets: bit vectors and Bloom filters"
short = "Compact sets"
focus = "Represent a set with one bit per possible member, or approximately in far less with a Bloom filter."
file = "src/Ch8_3CompactSets.java"
